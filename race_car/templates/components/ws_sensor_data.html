<div hx-swap-oob="innerHTML:#status">
    <div class="card-title">Current Sensor Data</div>
    {% for data in sensors_data %}

        {{ data.to_string() }}

    {% endfor %}
</div>
<ul hx-swap-oob="beforeend:#messages">
    {% for data in sensors_data %}
    <li>
        {{ data.to_string() }}
    </li>
    {% endfor %}
</ul>
