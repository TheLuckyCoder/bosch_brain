<label>
    <span class="label-text">Value:
        <span id="value-{{ actuator.name }}">0</span>
    </span>
    <input id="range-{{ actuator.name }}" name="value" type="range" min="-1" max="1" value="0" step="0.001"
           class="range range-primary"
           {% if !actuator.active -%} disabled{% endif -%}
           oninput="document.getElementById('value-{{ actuator.name }}').innerHTML = this.value"
           hx-trigger="input" ws-send hx-swap-oob="true" hx-headers='{"data_type": "value"}'/>
</label>
