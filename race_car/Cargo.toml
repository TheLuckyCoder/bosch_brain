[package]
name = "race_car"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }

# Async
tokio = { workspace = true }
multiqueue2 = "0.1.7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# HTTP
axum = { version = "0.7", features = ["http2", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "fs"] }
askama = { version = "0.12.1", features = ["with-axum"] }
askama_axum = "0.4.0"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = "3.4"

# Serial
serialport = { version = "4", default-features = false }

# Error handling
anyhow = { workspace = true }

# Utils
mint = { workspace = true }
chrono = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }
strum = { version = "0.26.1", features = ["derive"] }
rand = "0.9.0-alpha.1"
toml = "0.8.12"

### Sensors
linux-embedded-hal = { version = "0.4.0", default-features = false, features = ["gpio_cdev", "i2c"] }
rppal = { version = "0.17.1", features = ["hal"] }
hc-sr04 = "0.1"
bno055 = { version = "0.4.0", features = ["std"] }
#htu21df-sensor = { version = "0.1.4", features = ["std"] }
pwm-pca9685 = "1.0.0"
tower-livereload = "0.9.2"
